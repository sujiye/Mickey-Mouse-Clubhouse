<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时图像流接收器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .back-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #4a00e0, #8e2de2);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .image-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .image-display {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 400px;
            position: relative;
        }
        
        .image-display img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            transition: opacity 0.3s ease;
        }
        
        .image-loading {
            opacity: 0.7;
        }
        
        .placeholder {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            padding: 40px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #4a00e0, #8e2de2);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #11998e, #38ef7d);
        }
        
        .status {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
        }
        
        .status-indicator.connected {
            background: #28a745;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .metadata {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .data-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
        }
        
        .data-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .data-value {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .statistics {
            margin-top: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .connection-settings {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #8e2de2;
        }
        
        .settings-row {
            display: flex;
            gap: 15px;
        }
        
        .settings-row .input-group {
            flex: 1;
        }
        
        .logs {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .timestamp {
            color: #8e2de2;
        }
        
        .log-error {
            color: #ff6b6b;
        }
        
        .log-warning {
            color: #ffd93d;
        }
        
        .log-info {
            color: #6bcf7f;
        }
        
        .performance-warning {
            background: rgba(255, 107, 107, 0.2);
            border-left: 4px solid #ff6b6b;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()">返回</button>
    <div class="container">
        <header>
            <h1>实时图像流接收器</h1>
            <p class="subtitle">通过WebSocket接收并显示Base64编码的图像数据</p>
        </header>
        
        <div class="content">
            <div class="panel">
                <div class="image-container">
                    <h2>图像显示</h2>
                    <div class="image-display">
                        <div class="placeholder" id="placeholder">
                            等待连接并接收图像数据...
                        </div>
                        <img id="videoFrame" style="display: none;">
                    </div>
                    
                    <div class="controls">
                        <button id="connectBtn">连接WebSocket</button>
                        <button id="disconnectBtn" disabled>断开连接</button>
                        <button id="clearLogsBtn" class="btn-secondary">清除日志</button>
                        <button id="testDataBtn">测试数据</button>
                    </div>
                    
                    <div class="status">
                        <div class="status-indicator" id="statusIndicator"></div>
                        <span id="statusText">未连接</span>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>元数据</h2>
                
                <div class="metadata">
                    <div class="data-item">
                        <div class="data-label">时间戳</div>
                        <div class="data-value" id="timestamp">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">帧序号</div>
                        <div class="data-value" id="frameIndex">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">帧率 (FPS)</div>
                        <div class="data-value" id="fps">--</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">图像尺寸</div>
                        <div class="data-value" id="imageSize">--</div>
                    </div>
                </div>
                
                <div class="statistics">
                    <h3>统计信息</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="totalFrames">0</div>
                            <div class="stat-label">总帧数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="droppedFrames">0</div>
                            <div class="stat-label">丢帧数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="avgFps">0</div>
                            <div class="stat-label">平均FPS</div>
                        </div>
                    </div>
                </div>
                
                <div class="connection-settings">
                    <h3>连接设置</h3>
                    <div class="input-group">
                        <label for="wsUrl">WebSocket 服务器地址</label>
                        <input type="text" id="wsUrl" value="ws://localhost:8080">
                    </div>
                    <div class="settings-row">
                        <div class="input-group">
                            <label for="imageFormat">图像格式</label>
                            <select id="imageFormat">
                                <option value="jpeg">JPEG</option>
                                <option value="png">PNG</option>
                                <option value="auto">自动检测</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="maxImageSize">最大图像尺寸(px)</label>
                            <input type="number" id="maxImageSize" value="1920" min="100" max="4096">
                        </div>
                    </div>
                </div>
                
                <div class="logs">
                    <h3>日志</h3>
                    <div id="logContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let ws = null;
        let isConnected = false;
        let frameCount = 0;
        let droppedFrames = 0;
        let startTime = null;
        let lastFrameTime = null;
        let frameTimes = [];
        const logContainer = document.getElementById('logContainer');
        
        // DOM元素
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const clearLogsBtn = document.getElementById('clearLogsBtn');
        const testDataBtn = document.getElementById('testDataBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const videoFrame = document.getElementById('videoFrame');
        const placeholder = document.getElementById('placeholder');
        const timestampEl = document.getElementById('timestamp');
        const frameIndexEl = document.getElementById('frameIndex');
        const fpsEl = document.getElementById('fps');
        const imageSizeEl = document.getElementById('imageSize');
        const totalFramesEl = document.getElementById('totalFrames');
        const droppedFramesEl = document.getElementById('droppedFrames');
        const avgFpsEl = document.getElementById('avgFps');
        const wsUrlInput = document.getElementById('wsUrl');
        const imageFormatSelect = document.getElementById('imageFormat');
        const maxImageSizeInput = document.getElementById('maxImageSize');
        
        // 添加日志
        function addLog(message, type = 'info') {
            const now = new Date();
            const timestamp = now.toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // 限制日志条目数量
            const logs = logContainer.querySelectorAll('.log-entry');
            if (logs.length > 100) {
                logs[0].remove();
            }
        }
        
        // 更新连接状态
        function updateConnectionStatus(connected) {
            isConnected = connected;
            statusIndicator.className = 'status-indicator' + (connected ? ' connected' : '');
            statusText.textContent = connected ? '已连接' : '未连接';
            connectBtn.disabled = connected;
            disconnectBtn.disabled = !connected;
        }
        
        // 检测图像格式
        function detectImageFormat(base64Data) {
            if (base64Data.startsWith('/9j/') || base64Data.startsWith('data:image/jpeg')) {
                return 'jpeg';
            } else if (base64Data.startsWith('iVBORw0KGgo') || base64Data.startsWith('data:image/png')) {
                return 'png';
            }
            return 'jpeg'; // 默认
        }
        
        // 处理接收到的图像数据
        function processImageData(data) {
            try {
                // 更新元数据 - 适配不同的后端字段命名
                timestampEl.textContent = data.timestamp || data.time || '--';
                frameIndexEl.textContent = data.frame_index || data.frameNumber || data.id || '--';
                fpsEl.textContent = data.fps || data.frame_rate || '--';
                
                // 获取图像数据
                const imageData = data.image || data.data || data.frame;
                if (!imageData) {
                    addLog('警告: 未找到图像数据字段', 'warning');
                    return;
                }
                
                // 确定图像格式
                let imageFormat = imageFormatSelect.value;
                if (imageFormat === 'auto') {
                    imageFormat = detectImageFormat(imageData);
                }
                
                // 构建数据URL
                let dataUrl = imageData;
                if (!imageData.startsWith('data:')) {
                    dataUrl = `data:image/${imageFormat};base64,${imageData}`;
                }
                
                // 显示图像
                placeholder.style.display = 'none';
                videoFrame.style.display = 'block';
                videoFrame.classList.add('image-loading');
                
                // 设置图像源
                videoFrame.onload = function() {
                    videoFrame.classList.remove('image-loading');
                    const maxSize = parseInt(maxImageSizeInput.value);
                    
                    // 检查图像尺寸
                    if (videoFrame.naturalWidth > maxSize || videoFrame.naturalHeight > maxSize) {
                        const warning = document.createElement('div');
                        warning.className = 'performance-warning';
                        warning.textContent = `图像尺寸较大 (${videoFrame.naturalWidth}×${videoFrame.naturalHeight})，可能影响性能`;
                        
                        // 只显示一次警告
                        if (!document.querySelector('.performance-warning')) {
                            document.querySelector('.image-container').appendChild(warning);
                        }
                    }
                    
                    imageSizeEl.textContent = `${videoFrame.naturalWidth} × ${videoFrame.naturalHeight}`;
                };
                
                videoFrame.onerror = function() {
                    addLog('错误: 图像加载失败，尝试切换图像格式', 'error');
                    videoFrame.style.display = 'none';
                    placeholder.style.display = 'block';
                    placeholder.textContent = '图像加载失败';
                };
                
                videoFrame.src = dataUrl;
                
                // 更新帧统计
                frameCount++;
                updateStats();
                
                // 计算帧间隔和丢帧
                const now = Date.now();
                if (lastFrameTime) {
                    const frameInterval = now - lastFrameTime;
                    frameTimes.push(frameInterval);
                    
                    // 保持最近100帧的时间记录
                    if (frameTimes.length > 100) {
                        frameTimes.shift();
                    }
                    
                    // 如果帧间隔大于预期帧间隔的1.5倍，认为是丢帧
                    const expectedInterval = data.fps ? 1000 / data.fps : 33;
                    if (frameInterval > expectedInterval * 1.5) {
                        droppedFrames++;
                        droppedFramesEl.textContent = droppedFrames;
                    }
                }
                lastFrameTime = now;
                
            } catch (error) {
                addLog('错误: 处理图像数据失败 - ' + error.message, 'error');
                console.error('数据处理错误:', error);
            }
        }
        
        // 连接WebSocket
        function connectWebSocket() {
            const wsUrl = wsUrlInput.value.trim();
            
            if (!wsUrl) {
                addLog('错误: WebSocket服务器地址不能为空', 'error');
                return;
            }
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = function(event) {
                    addLog('WebSocket连接已建立', 'info');
                    updateConnectionStatus(true);
                    startTime = Date.now();
                    frameCount = 0;
                    droppedFrames = 0;
                    frameTimes = [];
                    updateStats();
                };
                
                ws.onmessage = function(event) {
                    try {
                        // 解析接收到的数据
                        const data = JSON.parse(event.data);
                        processImageData(data);
                    } catch (error) {
                        addLog('错误: 解析数据失败 - ' + error.message, 'error');
                        // 尝试直接作为Base64图像处理
                        if (typeof event.data === 'string' && event.data.length > 100) {
                            addLog('尝试直接处理为图像数据', 'warning');
                            processImageData({ image: event.data });
                        }
                    }
                };
                
                ws.onerror = function(error) {
                    addLog('WebSocket错误: ' + error.type, 'error');
                };
                
                ws.onclose = function(event) {
                    addLog(`WebSocket连接已关闭 (代码: ${event.code}, 原因: ${event.reason || '未知'})`, 'info');
                    updateConnectionStatus(false);
                    placeholder.style.display = 'block';
                    videoFrame.style.display = 'none';
                };
                
            } catch (error) {
                addLog('错误: 无法创建WebSocket连接 - ' + error.message, 'error');
            }
        }
        
        // 断开WebSocket连接
        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        // 更新统计信息
        function updateStats() {
            totalFramesEl.textContent = frameCount;
            
            if (startTime && frameCount > 0) {
                const elapsedTime = (Date.now() - startTime) / 1000; // 转换为秒
                const avgFps = elapsedTime > 0 ? (frameCount / elapsedTime).toFixed(1) : '0';
                avgFpsEl.textContent = avgFps;
                
                // 计算最近平均FPS
                if (frameTimes.length > 0) {
                    const avgInterval = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
                    const recentFps = (1000 / avgInterval).toFixed(1);
                    fpsEl.textContent = recentFps;
                }
            }
        }
        
        // 返回主页函数
        function goBack() {
            window.location.href = '宇境·室内障碍物识别辅助反馈软件.html';
        }

        // 生成测试数据
        function generateTestData() {
            if (!isConnected) {
                addLog('生成测试图像数据', 'info');
                
                // 创建一个简单的测试图像
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');
                
                // 绘制渐变背景
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#ff6b6b');
                gradient.addColorStop(0.5, '#4ecdc4');
                gradient.addColorStop(1, '#45b7d1');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制文本
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('测试图像', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '16px Arial';
                ctx.fillText(`帧: ${frameCount + 1}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText(new Date().toLocaleTimeString(), canvas.width / 2, canvas.height / 2 + 50);
                
                // 转换为Base64
                const imageData = canvas.toDataURL('image/jpeg').split(',')[1];
                
                // 模拟接收数据
                processImageData({
                    image: imageData,
                    timestamp: new Date().toISOString(),
                    frame_index: frameCount + 1,
                    fps: 30
                });
            } else {
                addLog('已连接到WebSocket，无法生成测试数据', 'warning');
            }
        }
        
        // 清除日志
        function clearLogs() {
            logContainer.innerHTML = '';
            addLog('日志已清除', 'info');
        }
        
        // 事件监听器
        connectBtn.addEventListener('click', connectWebSocket);
        disconnectBtn.addEventListener('click', disconnectWebSocket);
        clearLogsBtn.addEventListener('click', clearLogs);
        testDataBtn.addEventListener('click', generateTestData);
        
        // 初始化
        addLog('系统初始化完成', 'info');
    </script>
</body>
</html>
