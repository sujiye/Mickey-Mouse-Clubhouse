<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>过场动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        
        .play-btn {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            animation: pulse 2s infinite;
        }
        
        .play-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
            animation: none;
        }
        
        .play-btn:active {
            transform: scale(0.95);
        }
        
        .play-btn .icon {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid white;
            margin-left: 5px;
            transition: all 0.3s ease;
        }
        
        .play-btn:hover .icon {
            border-left-color: rgba(255, 255, 255, 0.9);
        }
        
        .return-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 100;
        }
        
        .return-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .return-btn:active {
            transform: translateY(0);
        }
        
        /* 脉冲动画 */
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(255, 255, 255, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }
        
        /* 提示文字 */
        .hint-text {
            margin-top: 30px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            max-width: 300px;
            line-height: 1.5;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .return-btn {
                padding: 10px 20px;
                font-size: 14px;
            }
            
            .play-btn {
                width: 80px;
                height: 80px;
            }
            
            .play-btn .icon {
                border-top: 12px solid transparent;
                border-bottom: 12px solid transparent;
                border-left: 20px solid white;
                margin-left: 4px;
            }
            
            .hint-text {
                font-size: 14px;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="myVideo" preload="auto" playsinline>
            <!-- 请替换为您自己的视频文件路径 -->
            <source src="./过场动画.mp4" type="video/mp4">
            您的浏览器不支持视频播放。
        </video>
        
        <div class="overlay" id="overlay">
            <button class="play-btn" id="playBtn">
                <div class="icon"></div>
            </button>
        </div>
    </div>
    
    <!-- 音频元素 -->
    <audio id="backgroundAudio" preload="auto">
        <!-- 请替换为您自己的音频文件路径 -->
        <source src="./过场音频.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放。
    </audio>
    
    <button class="return-btn" onclick="goBack()">
        <span>返回</span>
    </button>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('myVideo');
            const audio = document.getElementById('backgroundAudio');
            const playBtn = document.getElementById('playBtn');
            const overlay = document.getElementById('overlay');
            
            // 播放按钮点击事件
            playBtn.addEventListener('click', function() {
                // 播放视频
                video.play().catch(error => {
                    console.log('视频播放失败:', error);
                });
                
                // 播放音频
                audio.volume = 0.5;
                audio.play().catch(error => {
                    console.log('音频播放失败:', error);
                });
                
                // 隐藏覆盖层
                overlay.style.display = 'none';
            });
        });
        
        // 返回按钮功能
        function goBack() {
            // 请将下面的URL替换为您想要返回的页面
            window.location.href = './宇境·室内障碍物识别辅助反馈软件.html';
        }
    </script>
</body>
</html>
